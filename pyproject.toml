[project]
name = "piiclf"
version = "0.1.0"
description = "PII detection for source code repositories (Go mostly)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pathspec>=0.12",
]

# Phase 1 (regex/entropy baseline + scanner) needs only the core deps above.
# The ML Stack is deliberately optional so the scanner stays fast to install.
[project.optional-dependencies]
ml = [
    "torch>=2.6",
    "transformers>=4.48",
    "datasets>=3.2",
    "accelerate>=1.3",
    "seqeval>=1.2.2",
    "faker>=33.0",
    "tree-sitter>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]
dev = ["pytest>=8.3"]

[project.scripts]
piiclf = "piiclf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piiclf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
