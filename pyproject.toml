[project]
name = "piiclf"
version = "0.1.0"
description = "PII detection for source code repositories (Go, Node/TypeScript)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pathspec>=0.12",
]

# Phase 1 (regex/entropy baseline + scanner) needs only the core deps above.
# The ML stack is deliberately optional so the scanner stays fast to install.
[project.optional-dependencies]
# Needed from Phase 3 onward. Trimmed to what is actually imported:
# `datasets`/`seqeval`/`accelerate` are unused (plain JSONL, and span-level
# scoring is hand-rolled in evaluate.py), and the JS/TS grammars belong to
# Phase 6, not now.
ml = [
    "torch>=2.6",
    "transformers>=4.48",
    "tree-sitter>=0.23",
    "tree-sitter-go>=0.23",
    "faker>=33.0",
]
dev = ["pytest>=8.3"]

[project.scripts]
piiclf = "piiclf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piiclf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
